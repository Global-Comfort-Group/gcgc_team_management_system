services:
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcgc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gcgc_tms_production_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_TMS_CHAT_URL: ${NEXT_PUBLIC_TMS_CHAT_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gcgc:${DB_PASSWORD}@db:5432/gcgc_tms_production_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - ./public/uploads:/app/public/uploads:Z
    ports:
      - "3000:3000"

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
